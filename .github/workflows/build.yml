name: Build Settings Clone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Project Structure
      run: |
        mkdir -p SettingsClone.xcodeproj
        
        # Buat project.pbxproj yang bersih
        echo '// !$*UTF8*$!' > SettingsClone.xcodeproj/project.pbxproj
        echo '{ archiveVersion = 1; classes = {}; objectVersion = 56; objects = {}; rootObject = 110000010000000000000001; }' >> SettingsClone.xcodeproj/project.pbxproj

        # Buat Info.plist standar
        cat << 'EOF' > Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.suhana.SettingsClone</string>
            <key>CFBundleName</key>
            <string>SettingsClone</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>UILaunchScreen</key>
            <dict/>
        </dict>
        </plist>
        EOF

    - name: Build App with Swift Compiler
      run: |
        swiftc -parse-as-library ContentView.swift -o SettingsClone -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios16.0 -framework SwiftUI -framework UIKit

    - name: Package App into IPA
      run: |
        mkdir -p Payload/SettingsClone.app
        # Jika menggunakan swiftc langsung, kita bungkus output binernya
        mv SettingsClone Payload/SettingsClone.app/SettingsClone
        cp Info.plist Payload/SettingsClone.app/Info.plist
        zip -r SettingsClone.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SettingsClone-IPA
        path: SettingsClone.ipa
